<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>清新贪吃蛇</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <h1 class="title">清新贪吃蛇</h1>
          <p class="info">方向键 / WASD / 触摸滑动控制，空格暂停，撞墙或自撞即失败</p>
        </div>
        <span class="badge">可爱像素风 · 本地记录</span>
      </header>

      <section class="panel game-wrapper">
        <canvas id="game-canvas" aria-label="贪吃蛇游戏画布" role="img"></canvas>
      </section>

      <aside class="panel">
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-title">当前分数</div>
            <div class="stat-value" id="score">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">最高分</div>
            <div class="stat-value" id="best">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">蛇身长度</div>
            <div class="stat-value" id="length">0</div>
          </div>
        </div>

        <div class="controls">
          <button id="start-btn">开始 / 继续</button>
          <button id="pause-btn" class="secondary">暂停 (Space)</button>
          <button id="restart-btn" class="secondary">重新开始</button>
        </div>

        <div class="slider-field">
          <label for="speed">速度调节：</label>
          <input type="range" id="speed" />
          <span id="speed-label" class="highlight"></span>
        </div>

        <p class="info" id="tooltip">准备就绪，方向键/WASD 开始移动</p>
        <div class="status" id="status">欢迎来到清新可爱的贪吃蛇~</div>

        <div class="footer">
          <strong>玩法提示：</strong>
          <ul>
            <li>吃到食物 +10 分，身体增长；达到目标长度即可获胜。</li>
            <li>空格暂停/继续，按钮也可以操作。</li>
            <li>移动端用手指滑动即可控制方向。</li>
          </ul>
          <div id="stats" class="info"></div>
        </div>
      </aside>
    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
